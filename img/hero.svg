<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- AI-generated hero illustration for Tåguppropet Skåne -->
  <!-- Style: minimalist flat vector, Skåne flag colors -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEC900"/>
      <stop offset="100%" stop-color="#FFF8E7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="320" width="800" height="80" fill="url(#ground)"/>
  <!-- Rail -->
  <rect y="340" width="800" height="3" fill="#6B7280"/>
  <rect y="355" width="800" height="3" fill="#6B7280"/>
  <!-- Sleepers -->
  <g fill="#9CA3AF">
    <rect x="30" y="338" width="8" height="22" rx="1"/>
    <rect x="70" y="338" width="8" height="22" rx="1"/>
    <rect x="110" y="338" width="8" height="22" rx="1"/>
    <rect x="150" y="338" width="8" height="22" rx="1"/>
    <rect x="190" y="338" width="8" height="22" rx="1"/>
    <rect x="230" y="338" width="8" height="22" rx="1"/>
    <rect x="270" y="338" width="8" height="22" rx="1"/>
    <rect x="310" y="338" width="8" height="22" rx="1"/>
    <rect x="350" y="338" width="8" height="22" rx="1"/>
    <rect x="390" y="338" width="8" height="22" rx="1"/>
    <rect x="430" y="338" width="8" height="22" rx="1"/>
    <rect x="470" y="338" width="8" height="22" rx="1"/>
    <rect x="510" y="338" width="8" height="22" rx="1"/>
    <rect x="550" y="338" width="8" height="22" rx="1"/>
    <rect x="590" y="338" width="8" height="22" rx="1"/>
    <rect x="630" y="338" width="8" height="22" rx="1"/>
    <rect x="670" y="338" width="8" height="22" rx="1"/>
    <rect x="710" y="338" width="8" height="22" rx="1"/>
    <rect x="750" y="338" width="8" height="22" rx="1"/>
  </g>
  <!-- Train body -->
  <g>
    <rect x="160" y="195" width="480" height="145" rx="12" fill="#8B2332"/>
    <!-- Roof -->
    <rect x="170" y="190" width="460" height="12" rx="6" fill="#6B1A26"/>
    <!-- Windshield -->
    <rect x="600" y="210" width="30" height="80" rx="6" fill="#A8D8EA" opacity="0.9"/>
    <rect x="160" y="210" width="30" height="80" rx="6" fill="#A8D8EA" opacity="0.9"/>
    <!-- Stripe -->
    <rect x="175" y="270" width="450" height="8" rx="4" fill="#FEC900"/>
    <!-- Windows -->
    <g fill="#A8D8EA" opacity="0.7">
      <rect x="210" y="215" width="50" height="45" rx="6"/>
      <rect x="280" y="215" width="50" height="45" rx="6"/>
      <rect x="350" y="215" width="50" height="45" rx="6"/>
      <rect x="420" y="215" width="50" height="45" rx="6"/>
      <rect x="490" y="215" width="50" height="45" rx="6"/>
      <rect x="560" y="215" width="25" height="45" rx="6"/>
    </g>
    <!-- Wheels -->
    <circle cx="220" cy="340" r="24" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="220" cy="340" r="8" fill="#9CA3AF"/>
    <circle cx="340" cy="340" r="24" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="340" cy="340" r="8" fill="#9CA3AF"/>
    <circle cx="460" cy="340" r="24" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="460" cy="340" r="8" fill="#9CA3AF"/>
    <circle cx="580" cy="340" r="24" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="580" cy="340" r="8" fill="#9CA3AF"/>
    <!-- Headlight -->
    <circle cx="633" cy="250" r="8" fill="#FEC900" opacity="0.9"/>
    <circle cx="635" cy="250" r="4" fill="#FFF"/>
  </g>
  <!-- Foreground tree silhouettes -->
  <g fill="#D1D5DB" opacity="0.5">
    <ellipse cx="60" cy="280" rx="30" ry="60"/>
    <rect x="56" y="280" width="8" height="40" rx="2"/>
    <ellipse cx="100" cy="300" rx="20" ry="40"/>
  </g>
  <g fill="#D1D5DB" opacity="0.3">
    <ellipse cx="720" cy="290" rx="25" ry="50"/>
    <rect x="716" y="290" width="8" height="30" rx="2"/>
    <ellipse cx="760" cy="300" rx="20" ry="42"/>
  </g>
  <!-- Small flag details on train -->
  <rect x="175" y="200" width="18" height="10" rx="1" fill="#FEC900"/>
</svg>