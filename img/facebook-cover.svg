<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" fill="none">
  <!-- Facebook cover photo for Tåguppropet Skåne -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEC900"/>
      <stop offset="100%" stop-color="#FFF8E7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#sky)"/>

  <!-- Ground -->
  <rect y="500" width="1640" height="124" fill="url(#ground)"/>

  <!-- Rails -->
  <rect y="520" width="1640" height="4" fill="#6B7280"/>
  <rect y="542" width="1640" height="4" fill="#6B7280"/>

  <!-- Sleepers -->
  <g fill="#9CA3AF">
    <rect x="40" y="516" width="12" height="34" rx="2"/>
    <rect x="100" y="516" width="12" height="34" rx="2"/>
    <rect x="160" y="516" width="12" height="34" rx="2"/>
    <rect x="220" y="516" width="12" height="34" rx="2"/>
    <rect x="280" y="516" width="12" height="34" rx="2"/>
    <rect x="340" y="516" width="12" height="34" rx="2"/>
    <rect x="400" y="516" width="12" height="34" rx="2"/>
    <rect x="460" y="516" width="12" height="34" rx="2"/>
    <rect x="520" y="516" width="12" height="34" rx="2"/>
    <rect x="580" y="516" width="12" height="34" rx="2"/>
    <rect x="640" y="516" width="12" height="34" rx="2"/>
    <rect x="700" y="516" width="12" height="34" rx="2"/>
    <rect x="760" y="516" width="12" height="34" rx="2"/>
    <rect x="820" y="516" width="12" height="34" rx="2"/>
    <rect x="880" y="516" width="12" height="34" rx="2"/>
    <rect x="940" y="516" width="12" height="34" rx="2"/>
    <rect x="1000" y="516" width="12" height="34" rx="2"/>
    <rect x="1060" y="516" width="12" height="34" rx="2"/>
    <rect x="1120" y="516" width="12" height="34" rx="2"/>
    <rect x="1180" y="516" width="12" height="34" rx="2"/>
    <rect x="1240" y="516" width="12" height="34" rx="2"/>
    <rect x="1300" y="516" width="12" height="34" rx="2"/>
    <rect x="1360" y="516" width="12" height="34" rx="2"/>
    <rect x="1420" y="516" width="12" height="34" rx="2"/>
    <rect x="1480" y="516" width="12" height="34" rx="2"/>
    <rect x="1540" y="516" width="12" height="34" rx="2"/>
    <rect x="1600" y="516" width="12" height="34" rx="2"/>
  </g>

  <!-- Train body -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="800" height="240" rx="18" fill="#8B2332"/>
    <!-- Roof -->
    <rect x="15" y="-10" width="770" height="18" rx="9" fill="#6B1A26"/>
    <!-- Windshields -->
    <rect x="30" y="25" width="45" height="130" rx="8" fill="#A8D8EA" opacity="0.9"/>
    <rect x="725" y="25" width="45" height="130" rx="8" fill="#A8D8EA" opacity="0.9"/>
    <!-- Stripe -->
    <rect x="25" y="140" width="750" height="12" rx="6" fill="#FEC900"/>
    <!-- Windows -->
    <g fill="#A8D8EA" opacity="0.7">
      <rect x="100" y="30" width="90" height="75" rx="8"/>
      <rect x="210" y="30" width="90" height="75" rx="8"/>
      <rect x="320" y="30" width="90" height="75" rx="8"/>
      <rect x="430" y="30" width="90" height="75" rx="8"/>
      <rect x="540" y="30" width="90" height="75" rx="8"/>
      <rect x="650" y="30" width="55" height="75" rx="8"/>
    </g>
    <!-- Wheels -->
    <circle cx="120" cy="240" r="38" fill="#374151" stroke="#1F2937" stroke-width="4"/>
    <circle cx="120" cy="240" r="12" fill="#9CA3AF"/>
    <circle cx="320" cy="240" r="38" fill="#374151" stroke="#1F2937" stroke-width="4"/>
    <circle cx="320" cy="240" r="12" fill="#9CA3AF"/>
    <circle cx="520" cy="240" r="38" fill="#374151" stroke="#1F2937" stroke-width="4"/>
    <circle cx="520" cy="240" r="12" fill="#9CA3AF"/>
    <circle cx="720" cy="240" r="38" fill="#374151" stroke="#1F2937" stroke-width="4"/>
    <circle cx="720" cy="240" r="12" fill="#9CA3AF"/>
    <!-- Headlight -->
    <circle cx="790" cy="65" r="12" fill="#FEC900" opacity="0.9"/>
    <circle cx="794" cy="65" r="6" fill="#FFF"/>
    <!-- Flag detail -->
    <rect x="30" y="5" width="28" height="16" rx="2" fill="#FEC900"/>
  </g>

  <!-- Text -->
  <text x="1020" y="195" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#8B2332" text-anchor="start">Tåguppropet Skåne</text>
  <text x="1020" y="260" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#374151" text-anchor="start">Skånes tågtrafik i kris</text>
  <text x="1020" y="315" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#6B7280" text-anchor="start">taguppropet.se</text>
</svg>
